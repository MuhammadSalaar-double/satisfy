<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bloom — Interactive Generative Garden</title>

  <!-- ==================== CSS SECTION ==================== -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      /* Prevent any mobile scrolling, zooming, or callout menus */
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #garden {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: pointer;
    }

    .instruction {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      /* FIX: Darkened from #c8c8c8 to #757575 for WCAG AA contrast (4.6:1) */
      color: #757575;
      pointer-events: none;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.05em;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

  <canvas id="garden"></canvas>
  <div class="instruction">Tap anywhere to plant a flower</div>

  <!-- ==================== JAVASCRIPT SECTION ==================== -->
  <script>
    (function() {
      'use strict';

      /* ---------- CONFIGURATION ---------- */
      const CONFIG = {
        maxFlowers: 25,          // Hard cap to guarantee 60 FPS on mobile
        maxParticles: 80,        // Global particle limit
        maxFallingPetals: 40,    // Global falling petal limit
        maxRipples: 15           // Global ripple limit
      };

      /* ---------- UTILITIES ---------- */
      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      // Elastic pop for satisfying bloom (10% overshoot is intentional design)
      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }

      // Smooth deceleration for fading
      function easeOutQuad(t) {
        return 1 - (1 - t) * (1 - t);
      }

      // Curated hue ranges for harmonious soft-vibrant palettes
      function randomHue() {
        const ranges = [
          [340, 380], // pink / red
          [10, 50],   // orange / yellow
          [160, 200], // teal / cyan
          [260, 300], // purple / violet
          [200, 240]  // blue / indigo
        ];
        const range = ranges[Math.floor(Math.random() * ranges.length)];
        let h = random(range[0], range[1]);
        if (h >= 360) h -= 360;
        return h;
      }

      /* ---------- AUDIO SYSTEM ---------- */
      class AmbientAudio {
        constructor() {
          this.ctx = null;
          this.initialized = false;
        }

        init() {
          if (this.initialized) return;
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          this.ctx = new AudioContext();
          this.initialized = true;

          // Suspend audio when tab is hidden to save battery & respect browser policies
          // FIX: Also resume when tab becomes visible again (with catch for policy safety)
          document.addEventListener('visibilitychange', () => {
            if (!this.ctx) return;
            if (document.hidden) {
              this.ctx.suspend().catch(() => {});
            } else {
              this.ctx.resume().catch(() => {});
            }
          });
        }

        resume() {
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {}); // swallow policy rejections silently
          }
        }

        // Map hue to a pentatonic scale for always-pleasant harmony
        playBloom(hue) {
          if (!this.ctx) return;
          const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
          const idx = Math.floor((hue / 360) * scale.length) % scale.length;
          const base = scale[idx];
          const now = this.ctx.currentTime;

          // Primary soft sine tone
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(base, now);
          osc.frequency.exponentialRampToValueAtTime(base * 1.5, now + 0.4);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          // CRITICAL FIX: Disconnect nodes after playback to prevent memory leak
          osc.onended = () => {
            osc.disconnect();
            gain.disconnect();
          };

          osc.start(now);
          osc.stop(now + 1.0);
        }
      }

      /* ---------- FLOWER CLASS (with offscreen cache) ---------- */
      class Flower {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.age = 0;
          this.maxAge = Math.floor(random(280, 420));
          this.bloomDuration = Math.floor(random(35, 55));
          this.fadeStart = this.maxAge - Math.floor(random(90, 140));

          // Color palette
          this.hue = randomHue();
          this.saturation = Math.floor(random(65, 85));
          this.lightness = Math.floor(random(58, 72));

          // Geometry
          this.petalCount = Math.floor(random(6, 12));
          this.petalLength = random(28, 50);
          this.petalWidth = random(10, 18);
          this.baseRotation = random(0, Math.PI * 2);
          this.rotationSpeed = random(-0.003, 0.003);

          // Animation state
          this.targetScale = random(0.65, 1.1);
          this.scale = 0;
          this.opacity = 1;

          // Floating drift
          this.floatOffset = random(0, Math.PI * 2);
          this.floatSpeed = random(0.012, 0.028);
          this.floatAmp = random(5, 12);
          this.floatY = 0;

          // FIX: Frame-rate-independent petal spawn timer
          // Uses wall-clock time instead of frame modulo so density is identical at 30, 60, or 120 Hz
          this.nextPetalTime = performance.now() + random(0, 600);

          // PERFORMANCE FIX: Render flower once to offscreen canvas, then reuse as image
          this.cache = this.createCache();
          this.cacheSize = this.cache.width; // square cache
        }

        // Build the flower image once — gradients, shadows, and petals are baked in
        createCache() {
          const padding = 50;
          // Cache accommodates max possible overshoot:
          //   max(targetScale) * max(easeOutBack) ≈ 1.1 * 1.1 = 1.21
          //   petalLength * 2.5 * 1.2 gives ~3.0x radius, more than enough for 1.21x scale
          const maxDrawScale = 1.2;
          const size = Math.ceil((this.petalLength * 2.5 * maxDrawScale) + padding);
          const c = document.createElement('canvas');
          c.width = size;
          c.height = size;
          const ctx = c.getContext('2d');
          const cx = size / 2;
          const cy = size / 2;

          // Soft ambient glow behind the flower
          const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, this.petalLength * 1.5);
          glow.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, 0.22)`);
          glow.addColorStop(1, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, 0)`);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(cx, cy, this.petalLength * 1.5, 0, Math.PI * 2);
          ctx.fill();

          // Outer petals
          this.drawPetalLayer(ctx, cx, cy, this.petalCount, this.petalLength, this.petalWidth, 1.0);

          // Inner petals (offset rotation, smaller, slightly dimmer)
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(Math.PI / this.petalCount);
          ctx.translate(-cx, -cy);
          this.drawPetalLayer(ctx, cx, cy, this.petalCount, this.petalLength * 0.62, this.petalWidth * 0.72, 0.82);
          ctx.restore();

          // Center stamen
          const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 6);
          cg.addColorStop(0, '#fff');
          cg.addColorStop(0.4, `hsl(${this.hue}, 50%, 85%)`);
          cg.addColorStop(1, `hsl(${this.hue}, 90%, 55%)`);
          ctx.fillStyle = cg;
          ctx.beginPath();
          ctx.arc(cx, cy, 6, 0, Math.PI * 2);
          ctx.fill();

          return c;
        }

        drawPetalLayer(ctx, cx, cy, count, length, width, alphaMult) {
          const dark = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness - 12}%, ${alphaMult})`;
          const base = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${alphaMult})`;
          const light = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness + 10}%, ${alphaMult})`;

          for (let i = 0; i < count; i++) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((Math.PI * 2 / count) * i);

            // Gradient gives 3D depth to each petal
            const g = ctx.createLinearGradient(0, 0, 0, -length);
            g.addColorStop(0, dark);
            g.addColorStop(0.5, base);
            g.addColorStop(1, light);
            ctx.fillStyle = g;

            // Elegant organic petal shape
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(width, -length * 0.3, width * 0.6, -length * 0.85, 0, -length);
            ctx.bezierCurveTo(-width * 0.6, -length * 0.85, -width, -length * 0.3, 0, 0);
            ctx.fill();

            // Subtle vein line
            ctx.strokeStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness - 25}%, ${0.2 * alphaMult})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(0, -2);
            ctx.quadraticCurveTo(0, -length * 0.5, 0, -length * 0.88);
            ctx.stroke();

            ctx.restore();
          }
        }

        update() {
          this.age++;

          // Bloom phase: elastic scale-up
          if (this.age < this.bloomDuration) {
            const t = this.age / this.bloomDuration;
            this.scale = this.targetScale * easeOutBack(t);
          } else {
            // Gentle expansion while aging
            this.scale = this.targetScale * (1 + (this.age - this.bloomDuration) * 0.00012);
          }

          // Fade phase
          if (this.age > this.fadeStart) {
            const p = (this.age - this.fadeStart) / (this.maxAge - this.fadeStart);
            this.opacity = 1 - easeOutQuad(p);
          }

          // Slow rotation + floating motion
          this.baseRotation += this.rotationSpeed;
          this.floatY = Math.sin(this.age * this.floatSpeed + this.floatOffset) * this.floatAmp;

          // Remove when fully faded or max age reached
          return this.age < this.maxAge && this.opacity > 0.005;
        }

        // PERFORMANCE FIX: Just draw the cached image — no per-frame gradients or shadows
        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = this.opacity;
          ctx.translate(this.x, this.y + this.floatY);
          ctx.rotate(this.baseRotation);
          ctx.scale(this.scale, this.scale);
          ctx.drawImage(this.cache, -this.cacheSize / 2, -this.cacheSize / 2);
          ctx.restore();
        }
      }

      /* ---------- PARTICLE (SPARKLE) CLASS ---------- */
      class Particle {
        constructor(x, y, hue) {
          this.x = x;
          this.y = y;
          this.vx = random(-2.2, 2.2);
          this.vy = random(-3.2, -1.0);
          this.life = Math.floor(random(20, 45));
          this.maxLife = this.life;
          this.size = random(2, 4.5);
          this.hue = hue + random(-10, 10);
          this.decay = random(0.92, 0.98);
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= this.decay;
          this.vy *= this.decay;
          this.vy += 0.04; // gravity
          this.life--;
          return this.life > 0;
        }

        draw(ctx) {
          const a = this.life / this.maxLife;
          ctx.save();
          ctx.globalAlpha = a;
          ctx.fillStyle = `hsl(${this.hue}, 85%, 70%)`;
          // PERFORMANCE: removed shadowBlur for particles to maintain 60fps
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size * a, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      /* ---------- RIPPLE CLASS ---------- */
      class Ripple {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.radius = 2;
          this.maxRadius = random(35, 80);
          this.life = 40;
          this.maxLife = this.life;
          this.lineWidth = random(1.5, 2.5);
        }

        update() {
          // Eased expansion
          this.radius += (this.maxRadius - this.radius) * 0.12;
          this.life--;
          return this.life > 0;
        }

        draw(ctx) {
          const a = this.life / this.maxLife;
          ctx.save();
          ctx.globalAlpha = a * 0.35;
          ctx.strokeStyle = '#bbbbbb';
          ctx.lineWidth = this.lineWidth * a;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      /* ---------- FALLING PETAL (TRAIL) CLASS ---------- */
      class FallingPetal {
        constructor(x, y, hue) {
          this.x = x;
          this.y = y;
          this.vx = random(-1.0, 1.0);
          this.vy = random(0.7, 1.8);
          this.rotation = random(0, Math.PI * 2);
          this.rotSpeed = random(-0.06, 0.06);
          this.size = random(3.5, 7);
          this.life = Math.floor(random(70, 130));
          this.maxLife = this.life;
          this.hue = hue + random(-15, 15);
          this.swayFreq = random(0.025, 0.07);
          this.swayAmp = random(0.4, 1.2);
        }

        update() {
          this.x += this.vx + Math.sin(this.life * this.swayFreq) * this.swayAmp;
          this.y += this.vy;
          this.rotation += this.rotSpeed;
          this.life--;
          return this.life > 0;
        }

        draw(ctx) {
          const a = this.life / this.maxLife;
          ctx.save();
          ctx.globalAlpha = a * 0.5;
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.fillStyle = `hsl(${this.hue}, 70%, 75%)`;
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size, this.size * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      /* ---------- MAIN GARDEN SYSTEM ---------- */
      class Garden {
        constructor() {
          this.canvas = document.getElementById('garden');
          this.ctx = this.canvas.getContext('2d');
          this.dpr = 1;
          this.width = 0;
          this.height = 0;

          this.flowers = [];
          this.particles = [];
          this.ripples = [];
          this.fallingPetals = [];

          this.hint = document.querySelector('.instruction');
          this.audio = new AmbientAudio();
          this.firstInteraction = false;
          this.lastInputTime = 0;
          this.running = true;

          this.resize();
          this.bindEvents();
          this.loop();
        }

        resize() {
          this.dpr = window.devicePixelRatio || 1;
          this.width = window.innerWidth;
          this.height = window.innerHeight;

          // FIX: Use Math.round instead of Math.floor to match true physical pixel count
          // on fractional DPR devices (e.g. 2.5x, 1.25x), preventing subpixel blur
          this.canvas.width = Math.round(this.width * this.dpr);
          this.canvas.height = Math.round(this.height * this.dpr);
          // setTransform resets the matrix completely — no cumulative drift on repeated resizes
          this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

          this.canvas.style.width = this.width + 'px';
          this.canvas.style.height = this.height + 'px';
        }

        bindEvents() {
          window.addEventListener('resize', () => this.resize());

          const handleInput = (e) => {
            // Debounce: prevent double-firing on hybrid touch+mouse devices
            const now = Date.now();
            if (now - this.lastInputTime < 40) return;
            this.lastInputTime = now;

            e.preventDefault();

            const points = [];
            if (e.touches && e.touches.length > 0) {
              for (let i = 0; i < e.touches.length; i++) {
                points.push({ x: e.touches[i].clientX, y: e.touches[i].clientY });
              }
            } else if (e.clientX !== undefined) {
              points.push({ x: e.clientX, y: e.clientY });
            }

            points.forEach(p => this.plantFlower(p.x, p.y));

            if (!this.firstInteraction) {
              this.firstInteraction = true;
              if (this.hint) this.hint.style.opacity = '0';
              this.audio.init();
            }
            this.audio.resume();
          };

          this.canvas.addEventListener('mousedown', handleInput);
          this.canvas.addEventListener('touchstart', handleInput, { passive: false });

          // Block pull-to-refresh and overscroll on mobile browsers
          this.canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

          // FIX: Removed touchend preventDefault. It was redundant (touchstart + touchmove already
          // lock the gesture) and suppresses synthetic click events used by assistive tech.

          // Pause animation loop when tab is hidden to save CPU / battery
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
              this.running = false;
            } else {
              if (!this.running) {
                this.running = true;
                this.loop();
              }
            }
          });
        }

        plantFlower(x, y) {
          // Hard cap — immediately remove oldest flower if at limit.
          while (this.flowers.length >= CONFIG.maxFlowers) {
            const old = this.flowers.shift();
            old.cache = null; // help GC
          }

          const flower = new Flower(x, y);
          this.flowers.push(flower);

          // Sparkle burst (reduced count for performance)
          const pCount = Math.floor(random(6, 12));
          for (let i = 0; i < pCount; i++) {
            if (this.particles.length >= CONFIG.maxParticles) {
              this.particles.shift(); // make room
            }
            this.particles.push(new Particle(x, y, flower.hue));
          }

          // Ripple ring
          if (this.ripples.length >= CONFIG.maxRipples) {
            this.ripples.shift();
          }
          this.ripples.push(new Ripple(x, y));

          // Initial falling petals
          const fCount = Math.floor(random(2, 4));
          for (let i = 0; i < fCount; i++) {
            if (this.fallingPetals.length >= CONFIG.maxFallingPetals) {
              this.fallingPetals.shift();
            }
            this.fallingPetals.push(new FallingPetal(x, y, flower.hue));
          }

          // Gentle audio chime
          this.audio.playBloom(flower.hue);
        }

        update() {
          const now = performance.now();

          // Update flowers; spawn occasional trailing petals during fade
          this.flowers = this.flowers.filter(flower => {
            const alive = flower.update();

            // FIX: Frame-rate-independent petal spawn using wall-clock time.
            // Old code used Math.random() < 0.015 per frame, which produced
            // half as many petals at 30 Hz and double at 120 Hz.
            if (alive && flower.age > flower.fadeStart && now >= flower.nextPetalTime) {
              if (this.fallingPetals.length < CONFIG.maxFallingPetals) {
                this.fallingPetals.push(
                  new FallingPetal(flower.x, flower.y + flower.floatY, flower.hue)
                );
              }
              flower.nextPetalTime = now + random(800, 1400);
            }

            // FIX: Nullify offscreen canvas when flower dies naturally so the GC
            // can reclaim the heavy bitmap memory immediately.
            if (!alive) {
              flower.cache = null;
            }

            return alive;
          });

          this.particles = this.particles.filter(p => p.update());
          this.ripples = this.ripples.filter(r => r.update());
          this.fallingPetals = this.fallingPetals.filter(p => p.update());
        }

        render() {
          const ctx = this.ctx;
          const w = this.width;
          const h = this.height;

          // Solid white clear every frame.
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);

          // Layered rendering: back to front
          this.ripples.forEach(r => r.draw(ctx));
          this.flowers.forEach(f => f.draw(ctx));
          this.fallingPetals.forEach(p => p.draw(ctx));
          this.particles.forEach(p => p.draw(ctx));
        }

        loop() {
          if (!this.running) return;
          this.update();
          this.render();
          requestAnimationFrame(() => this.loop());
        }
      }

      /* ---------- BOOT ---------- */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => new Garden());
      } else {
        new Garden();
      }
    })();
  </script>
</body>
</html>
